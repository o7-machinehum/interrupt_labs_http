<header class="pd-top">
    <nav class="pd-nav" aria-label="{{ .Title }} navigation">
        <a href="{{ "/" | relURL }}" class="pd-nav__brand" aria-label="Rootkit Labs home">
            <img src="{{ "/img/interrupt_white.svg" | relURL }}" alt="Rootkit Labs">
        </a>
        <div class="pd-nav__links">
            <a href="#details">Details</a>
            {{ if eq .Layout "flipper-blackhat" }}<a href="#edgar">Edgar case</a>{{ end }}
            <a href="{{ .Params.shop }}" class="pd-nav__shop">Shop</a>
        </div>
    </nav>
    <div class="pd-wrap pd-title">
        <h1>{{ .Title }}</h1>
    </div>
    <div class="pd-wrap">
        <div class="pd-video-shell">
            <iframe src="{{ .Params.video }}" title="{{ .Title }} product video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>
    </div>
    <aside class="pd-purchase" aria-label="Shop {{ .Title }}">
        <div class="pd-wrap pd-purchase__inner">
            <div class="pd-purchase__copy">
                <strong>Get {{ .Title }}</strong>
                <p>View current availability, pricing, and shipping details in the Rootkit Labs shop.</p>
            </div>
            <a href="{{ .Params.shop }}" class="pd-button">View in shop</a>
        </div>
    </aside>
</header>
